<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capybara Garden</title><style>body{margin:0;background:#dce8cf;font:16px system-ui;color:#30442d}canvas{display:block;touch-action:none}header{position:fixed;padding:18px;pointer-events:none}button{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;border:0;border-radius:24px;background:white}</style><header><h1>Capybara Garden</h1><p id="status"></p></header><button id="call">カピバラを呼ぶ</button><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const s=new T.Scene();s.background=new T.Color(0xdce8cf);const c=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);c.position.set(5,5,9);c.lookAt(0,0,0);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x657745,2.4));const l=new T.DirectionalLight(0xffefd0,3);l.position.set(3,8,4);s.add(l);const floor=new T.Mesh(new T.CircleGeometry(6,64),new T.MeshStandardMaterial({color:0x9ab77b}));floor.rotation.x=-Math.PI/2;s.add(floor);
const pet=new T.Group();s.add(pet);const brown=0x926141;function ell(parent,x,y,z,a,b,d,color){const m=new T.Mesh(new T.SphereGeometry(1,32,20),new T.MeshStandardMaterial({color,roughness:.95}));m.position.set(x,y,z);m.scale.set(a,b,d);parent.add(m);return m}ell(pet,0,.75,-.22,.52,.56,.86,brown);ell(pet,0,.99,.62,.39,.43,.49,brown);ell(pet,0,.88,.94,.34,.30,.32,0x805438);ell(pet,0,.98,1.19,.16,.09,.06,0x4d362b);for(const x of [-1,1]){ell(pet,x*.29,1.36,.48,.11,.15,.08,brown);ell(pet,x*.35,1.12,.76,.047,.052,.047,0x211c18)}const legs=[];for(const x of [-.32,.32])for(const z of [-.69,.38]){const g=new T.Group();g.position.set(x,.57,z);pet.add(g);ell(g,0,-.22,0,.15,.27,.16,brown);ell(g,0,-.45,.045,.14,.10,.21,0x705039);legs.push(g)}
const target=new T.Vector3();let state='idle',until=1,phase=0;const clock=new T.Clock();const status=document.querySelector('#status');function choose(){target.set((Math.random()-.5)*6,0,(Math.random()-.5)*6);state=Math.random()<.35?'run':'walk'}document.querySelector('#call').onclick=()=>{target.set(1,0,3);state='walk'};const ray=new T.Raycaster();r.domElement.addEventListener('pointerdown',e=>{ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),c);const hit=ray.intersectObject(floor)[0];if(hit){target.copy(hit.point);target.y=0;if(target.length()>4)target.setLength(4);state='walk'}});r.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(state==='idle'){until-=dt;if(until<=0)choose()}else{const d=target.clone().sub(pet.position);d.y=0;if(d.length()<.09){state='idle';until=2+Math.random()*4}else{pet.rotation.y=Math.atan2(d.x,d.z);pet.position.addScaledVector(d.normalize(),Math.min(d.length(),dt*(state==='run'?2.2:.8)))}}phase+=dt*(state==='run'?14:8);legs.forEach((g,i)=>g.rotation.x=state==='idle'?0:Math.sin(phase+(i===0||i===3?0:Math.PI))*.48);pet.position.y=state==='idle'?0:Math.abs(Math.sin(phase))*.04;status.textContent=({idle:'待機中',walk:'散歩中',run:'走っています'})[state];r.render(s,c)});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></html>
